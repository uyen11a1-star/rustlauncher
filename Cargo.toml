[package]
name = "rustlauncher"
version = "0.1.0"
edition = "2021"

[lib]
name = "rustlauncher"
crate-type = ["cdylib"]

[dependencies]
log = "0.4"
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "android-native-activity"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
winit = { version = "0.30", features = ["android-native-activity"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.android]
package = "dev.rustlauncher.app"
apk_name = "RustLauncher"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "Rust Launcher"

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|screenSize"
