[package]
name = "rustlauncher"
version = "0.5.0"
edition = "2021"

[lib]
name = "rustlauncher"
crate-type = ["cdylib"]

[dependencies]
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
lzma-rs = "0.3"
fontdue = "0.9"
android-activity = { version = "0.6", features = ["native-activity"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.android]
package = "dev.rustlauncher.app"
apk_name = "RustLauncher"
build_targets = ["aarch64-linux-android"]

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "Rust Launcher"

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|screenSize"
